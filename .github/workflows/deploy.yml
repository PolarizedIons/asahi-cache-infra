name: Deploy with SSH certificate

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Generate ephemeral SSH key
        run: ssh-keygen -t ed25519 -N "" -f gha_key

      - name: Get GitHub OIDC token
        run: |
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=ssh-ca-prod" \
            | jq -r .value > oidc.jwt

      - name: Request SSH certificate
        env:
          OIDC_SSH_CA_URL: https://asahi-deploy.polarizedions.net
        run: |
          jq -n --arg public_key "$(cat gha_key.pub)" '{public_key: $public_key}' \
            | curl -sS --fail "$OIDC_SSH_CA_URL/sign" \
                -H "Authorization: Bearer $(cat oidc.jwt)" \
                -H "Content-Type: application/json" \
                --data @- -o gha_key-cert.pub

      - name: Deploy
        env:
          NIX_SSHOPTS: "-i gha_key -o CertificateFile=gha_key-cert.pub -o IdentitiesOnly=yes -o UserKnownHostsFile=./.ssh/known_hosts -o StrictHostKeyChecking=yes"
        run: |
          nix run nixpkgs#nixos-rebuild -- switch \
            --flake .#phobos \
            --build-host deploy@phobos.polarizedions.net \
            --target-host deploy@phobos.polarizedions.net \
            --elevate=sudo

          # ssh -i gha_key \
          #   -o CertificateFile=gha_key-cert.pub \
          #   -o IdentitiesOnly=yes \
          #   -o UserKnownHostsFile=./.ssh/known_hosts \
          #   -o StrictHostKeyChecking=yes \
          #   deploy@phobos.polarizedions.net 'hostname && whoami'
